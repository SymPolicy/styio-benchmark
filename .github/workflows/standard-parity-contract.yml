name: Standard Parity Contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Validate frozen catalog
        run: python tools/standard_parity_gate.py catalog-check --contract workloads/parity-v2/contract.json

      - name: Audit C++ baseline strength
        run: python tools/standard_parity_gate.py cpp-strength --contract workloads/parity-v2/contract.json

      - name: Test the standard parity gate
        run: >-
          python -m pytest -q
          tests/test_standard_parity_gate.py
          tests/test_standard_parity_catalog.py
          tests/test_standard_cpp_strength.py

      - name: Test Styio Analyzer deterministic contract
        run: python -m pytest -q tests/test_styio_analyzer.py
